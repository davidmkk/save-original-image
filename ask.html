<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="askWindowTitle">No original image</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { padding: 18px 20px; }
  .preview { height: 170px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; overflow: hidden; }
  .preview img { max-width: 100%; max-height: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 12px; }
  #err { color: #d9480f; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="askTitle"></h1>
  <p class="muted" id="meta"></p>
  <div class="preview"><img id="img" alt=""></div>
  <p class="muted" id="anim" hidden></p>
  <div class="row">
    <button id="webp"></button>
    <button id="jpg" class="primary" data-i18n="askJpg"></button>
    <button id="png" data-i18n="askPng"></button>
  </div>
  <label><input type="checkbox" id="remember"> <span data-i18n="askRemember"></span></label>
  <p id="err"></p>
</main>
<script type="module" src="ask.js"></script>
</body>
</html>
